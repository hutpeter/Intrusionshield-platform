name: Database portability validation

on:
  push:
    branches:
      - feature/database-engine-independence
  workflow_dispatch:
  pull_request:
    paths:
      - 'packages/database/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/database-portability.yml'

permissions:
  contents: write

jobs:
  database-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      # Temporary until the pnpm lockfile is regenerated and committed.
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Commit regenerated lockfile to portability branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/database-engine-independence'
        run: |
          if ! git diff --quiet -- pnpm-lock.yaml; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add pnpm-lock.yaml
            git commit -m 'chore(database): lock PostgreSQL dependencies'
            git push origin HEAD:feature/database-engine-independence
          fi
      - name: Upload regenerated lockfile for review
        uses: actions/upload-artifact@v4
        with:
          name: database-portability-pnpm-lock
          path: pnpm-lock.yaml
          retention-days: 7
      - name: Build database package
        run: pnpm --filter @intrusionshield/database build
      - name: Test database package
        run: pnpm --filter @intrusionshield/database test --runInBand
